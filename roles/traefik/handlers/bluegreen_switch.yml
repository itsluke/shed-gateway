---
# Called via include_tasks from handlers/bluegreen.yml.
# block/rescue here gives us rollback on Traefik registration failure.
- block:
    - name: Wait for Traefik to register inactive service
      ansible.builtin.uri:
        url: "{{ traefik_api_external_url }}/http/services/{{ item.inactive.name }}@docker"
        return_content: true
        status_code: 200
      register: traefik_status
      retries: "{{ max_retries }}"
      delay: "{{ sleep_interval }}"
      until: "'UP' in traefik_status.content"
      loop: "{{ active_bluegreens }}"
      when: not ansible_check_mode

    # Build a new map with active pointing at the newly started (previously inactive) service.
    # Done as a separate set_fact loop so the template task below can render the full list at once —
    # using a loop+vars on the template task would write the file once per item, with each write
    # seeing only the current loop item's active service (last write wins, rest overwritten).
    - name: Build switched active map
      ansible.builtin.set_fact:
        bluegreen_switched_map: >-
          {{ (bluegreen_switched_map | default([])) + [{'name': item.name, 'active': item.inactive.name, 'inactive': item.active}] }}
      loop: "{{ active_bluegreens }}"
      when: not ansible_check_mode

    - name: Switch traffic — re-template bluegreen routing
      vars:
        bluegreen_active_map: "{{ bluegreen_switched_map }}"
      ansible.builtin.template:
        src: templates/bluegreen.yml.j2
        dest: "{{ docker_data_dir }}/traefik/config/dynamic/bluegreen.yml"
      when: not ansible_check_mode

    - name: Write color state file
      ansible.builtin.copy:
        content: "{{ item.inactive.name | regex_replace('^(blue|green)-.*', '\\1') }}"
        dest: "{{ docker_data_dir }}/traefik/bluegreen/{{ item.name }}"
      loop: "{{ active_bluegreens }}"
      when: not ansible_check_mode

    - name: Stop previously active service
      community.docker.docker_compose_v2:
        project_name: "{{ docker_compose_project_name }}"
        project_src: "{{ docker_compose_dir }}/"
        files: "{{ compose_files }}"
        state: absent
        wait: true
        services: "{{ item.active }}"
      loop: "{{ active_bluegreens }}"
      when: not ansible_check_mode

  rescue:
    - name: Rollback — report failure
      ansible.builtin.debug:
        msg: >-
          Blue-green deploy failed for {{ active_bluegreens | map(attribute='name') | join(', ') }}.
          Stopping newly started containers and leaving current active in place.

    - name: Rollback — stop inactive container
      community.docker.docker_compose_v2:
        project_name: "{{ docker_compose_project_name }}"
        project_src: "{{ docker_compose_dir }}/"
        files: "{{ compose_files }}"
        state: absent
        services: "{{ item.inactive.name }}"
      loop: "{{ active_bluegreens }}"

    - name: Re-raise
      ansible.builtin.fail:
        msg: "Blue-green deploy failed and was rolled back. See errors above."
