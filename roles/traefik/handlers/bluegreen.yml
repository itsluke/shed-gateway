- name: Register, switch, and clean up
  listen:
    - "deploy: bluegreen"
    - "containers: deploy bluegreen"
  ansible.builtin.include_tasks: bluegreen_switch.yml
  when:
    - active_bluegreens is defined
    - active_bluegreens | length > 0
